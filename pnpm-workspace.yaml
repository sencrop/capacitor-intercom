engineStrict: true
strictPeerDependencies: true
savePrefix: ""

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@sencrop/*"
trustPolicy: no-downgrade
trustPolicyExcludePrune: true
# exact versions audited as false positives of no-downgrade
trustPolicyExclude: []

allowBuilds: {}
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
