---
# "Release - publish" is one of the workflow names the GitHub Slack app posts to
# #deployment-updates-prod (org-wide subscription)
name: Release - publish

on:
  # dispatched by "Release - prepare" when release-please creates a release, or
  # run manually to publish an existing release tag again
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v10.1.0)
        required: true

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC), bound to this workflow's file name
    steps:
      - uses: actions/checkout@v7
        with:
          # publishes a tag, never a branch or a commit
          ref: refs/tags/${{ inputs.tag }}

      - name: Install dependencies
        uses: sencrop/github-workflows/actions/pnpm-install@master

      # the release PR, opened with GITHUB_TOKEN, runs no validation workflow,
      # and the push validation of this commit runs in parallel
      - name: Check format, lint and types
        run: pnpm run check

      - name: Pack
        run: |
          pnpm run build
          pnpm pack --pack-destination "$RUNNER_TEMP/package"

      # The trusted publisher only allows staging: a maintainer approves the
      # version with 2FA on npmjs.com before it goes live. pnpm cannot stage, and
      # npm refuses to run in this repo (devEngines asks for pnpm), hence the
      # tarball published from outside the checkout.
      - name: Stage on npm
        working-directory: ${{ runner.temp }}/package
        run: |
          npm stage publish ./*.tgz
          echo "Staged: approve it with 2FA on https://www.npmjs.com/, Menu > Staged Packages, or with \`npm stage approve <stage-id>\` (\`npm stage list @sencrop/capacitor-intercom\`)." >> "$GITHUB_STEP_SUMMARY"
